[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-frame-regression"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<0.142", "google-genai>=2.12,<3", "numpy>=2.4,<3", "pydantic>=2.12,<3", "uvicorn[standard]>=0.41,<0.42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
