[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-frame-regression"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "google-adk[gcp]>=2.7,<2.8",
  "google-genai>=2.12,<3",
  "mcp>=1.26,<2",
  "mcp-clickhouse>=0.3,<0.4",
  "clickhouse-connect>=0.9,<1",
  "numpy>=2.4,<3",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.41,<0.42",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.29,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `pytest-asyncio` is required: without it every `@pytest.mark.asyncio` test
# in tests/test_sql_parity.py is silently skipped rather than failed.
required_plugins = ["pytest-asyncio"]
