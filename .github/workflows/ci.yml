name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q safe_frame
      - name: Enforce Google-only AI policy
        run: |
          python - <<'PY'
          from pathlib import Path
          text = (Path("requirements.txt").read_text() + Path("pyproject.toml").read_text()).lower()
          forbidden = [name for name in ("openai", "anthropic", "mistral", "cohere", "bedrock") if name in text]
          if forbidden:
              raise SystemExit(f"Non-permitted AI dependencies: {forbidden}")
          PY
  page:
    # The pytest suite asserts what the page contains. It cannot catch a script
    # that throws at init and detaches every listener, which has happened twice.
    # This drives a real browser against the page with stubbed endpoints.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/visual_check.py --offline

  parity:
    # The central correctness claim of this project is that
    # sql/006_catalogue_regression.sql and safe_frame.detector implement the
    # same published rule. tests/test_sql_parity.py proves it -- but it needs a
    # cluster, so it skipped everywhere a reader could actually look, including
    # here. A green CI badge over 45 silently skipped tests is worse than no
    # badge: it asserts the claim while proving nothing.
    #
    # parity_sql() evaluates inline VALUES and writes no table, so a throwaway
    # ClickHouse with no schema is enough. No secrets, nothing to take on trust.
    runs-on: ubuntu-latest
    needs: verify
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: parity
          CLICKHOUSE_PASSWORD: parity
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8123/ping >/dev/null; then
              echo "clickhouse ready"; exit 0
            fi
            sleep 2
          done
          echo "clickhouse never became ready"; exit 1
      - name: SQL/Python parity through the official mcp-clickhouse transport
        env:
          MCP_CLICKHOUSE_COMMAND: mcp-clickhouse
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: parity
          CLICKHOUSE_PASSWORD: parity
          CLICKHOUSE_SECURE: "false"
          CLICKHOUSE_VERIFY: "false"
        run: |
          set -o pipefail
          python -m pytest tests/test_sql_parity.py -q -rs | tee parity.log
          # A skip here is the exact failure this job exists to prevent: it
          # would go green while proving nothing. Treat it as a hard failure.
          if grep -qiE "skipped|no tests ran" parity.log; then
            echo "::error::parity tests did not execute -- the MCP transport was not configured"
            exit 1
          fi
          grep -qE "[0-9]+ passed" parity.log || { echo "::error::no parity tests passed"; exit 1; }

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t safe-frame:test .
