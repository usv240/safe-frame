name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python -m compileall -q safe_frame
      - name: Enforce Google-only AI policy
        run: |
          python - <<'PY'
          from pathlib import Path
          text = (Path("requirements.txt").read_text() + Path("pyproject.toml").read_text()).lower()
          forbidden = [name for name in ("openai", "anthropic", "mistral", "cohere", "bedrock") if name in text]
          if forbidden:
              raise SystemExit(f"Non-permitted AI dependencies: {forbidden}")
          PY
  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t safe-frame:test .
